<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330" role="img" aria-labelledby="title desc">
<title id="title">PROJECTS</title><desc id="desc">Animated Midnight Glass project showcase with current project statuses for Waqar Farid.</desc>
<defs>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#191a30"/><stop offset="1" stop-color="#0d0e16"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .muted{fill:#aeb9d0}
    .white{fill:#f5f7ff}
    .cyan{fill:#38bdf8}
    .purple{fill:#dccfff}
    .card{fill:#171e30;stroke:#6277ac;stroke-opacity:.55}
    .pill{fill:#1b2236;stroke:#52628c;stroke-opacity:.65}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
</defs>
<rect width="1080" height="330" rx="26" fill="#0d0e16"/>
<circle cx="955" cy="76" r="96" fill="#a78bfa" opacity=".11" filter="url(#blur)"/>
<circle cx="118" cy="290" r="110" fill="#38bdf8" opacity=".10" filter="url(#blur)"/>
<rect x="3" y="3" width="1074" height="324" rx="24" fill="url(#surface)" stroke="#6477aa" stroke-opacity=".62" stroke-width="2"/>
<text x="42" y="45" class="white" font-size="23" font-weight="bold" letter-spacing="2">PROJECTS</text>
<text x="1038" y="45" text-anchor="end" fill="#a78bfa" font-size="13" letter-spacing="2">PROJECTS / 01</text>
<path d="M40 62 H1040" stroke="#40506f"/>
<path d="M40 62 H330" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="18 260;160 118;18 260" dur="7s" repeatCount="indefinite"/></path>
<circle cx="41" cy="40" r="4" fill="#38bdf8"><animate attributeName="opacity" values=".4;1;.4" dur="2.8s" repeatCount="indefinite"/></circle>

<text x="44" y="98" class="muted" font-size="16">Current work and completed builds</text>
<g>
  <rect class="card" x="42" y="120" width="490" height="72" rx="18"/>
  <text x="68" y="152" class="white" font-size="22" font-weight="bold">Sahiwal Mart</text>
  <rect x="366" y="138" width="145" height="32" rx="16" fill="#22253a" stroke="#a78bfa" stroke-opacity=".7"/><text x="438" y="159" text-anchor="middle" fill="#e1d6ff" font-size="14" font-weight="bold">Currently Developing</text>
  <rect class="card" x="548" y="120" width="490" height="72" rx="18"/>
  <text x="574" y="152" class="white" font-size="22" font-weight="bold">Personal Portfolio</text>
  <rect x="862" y="138" width="155" height="32" rx="16" fill="#22253a" stroke="#a78bfa" stroke-opacity=".7"/><text x="939" y="159" text-anchor="middle" fill="#e1d6ff" font-size="14" font-weight="bold">Currently Developing</text>
  <rect class="card" x="42" y="213" width="490" height="72" rx="18"/>
  <text x="68" y="245" class="white" font-size="22" font-weight="bold">Python Expense Tracker</text>
  <rect x="391" y="231" width="120" height="32" rx="16" fill="#1d2936" stroke="#38bdf8" stroke-opacity=".8"/><text x="451" y="252" text-anchor="middle" class="cyan" font-size="14" font-weight="bold">Completed</text>
  <rect class="card" x="548" y="213" width="490" height="72" rx="18"/>
  <text x="574" y="245" class="white" font-size="22" font-weight="bold">Animated GitHub Profile README</text>
  <rect x="897" y="231" width="120" height="32" rx="16" fill="#1d2936" stroke="#38bdf8" stroke-opacity=".8"/><text x="957" y="252" text-anchor="middle" class="cyan" font-size="14" font-weight="bold">Completed</text>
</g>
<path d="M1005 96 q18 14 0 28 q-18 14 0 28" stroke="#38bdf8" fill="none" stroke-width="3" stroke-linecap="round"><animate attributeName="opacity" values=".4;1;.4" dur="2.7s" repeatCount="indefinite"/></path>
</svg>