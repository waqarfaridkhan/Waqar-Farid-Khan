<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="250" viewBox="0 0 1080 250" role="img" aria-labelledby="title desc">
<title id="title">INTERESTS</title><desc id="desc">Animated Midnight Glass interests card showing traveling, reading books, gaming, artificial intelligence and creative designing.</desc>
<defs>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#191a30"/><stop offset="1" stop-color="#0d0e16"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .muted{fill:#aeb9d0}
    .white{fill:#f5f7ff}
    .cyan{fill:#38bdf8}
    .purple{fill:#dccfff}
    .card{fill:#171e30;stroke:#6277ac;stroke-opacity:.55}
    .pill{fill:#1b2236;stroke:#52628c;stroke-opacity:.65}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
</defs>
<rect width="1080" height="250" rx="26" fill="#0d0e16"/>
<circle cx="955" cy="76" r="96" fill="#a78bfa" opacity=".11" filter="url(#blur)"/>
<circle cx="118" cy="210" r="110" fill="#38bdf8" opacity=".10" filter="url(#blur)"/>
<rect x="3" y="3" width="1074" height="244" rx="24" fill="url(#surface)" stroke="#6477aa" stroke-opacity=".62" stroke-width="2"/>
<text x="42" y="45" class="white" font-size="23" font-weight="bold" letter-spacing="2">INTERESTS</text>
<text x="1038" y="45" text-anchor="end" fill="#a78bfa" font-size="13" letter-spacing="2">INTERESTS / 01</text>
<path d="M40 62 H1040" stroke="#40506f"/>
<path d="M40 62 H330" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="18 260;160 118;18 260" dur="7s" repeatCount="indefinite"/></path>
<circle cx="41" cy="40" r="4" fill="#38bdf8"><animate attributeName="opacity" values=".4;1;.4" dur="2.8s" repeatCount="indefinite"/></circle>

<text x="44" y="98" class="muted" font-size="16">Personal interests and creative energy</text>
<g font-size="18" font-weight="bold">
  <rect class="pill" x="44" y="126" width="185" height="44" rx="14"/><text x="136" y="154" class="cyan" text-anchor="middle">Traveling</text>
  <rect class="pill" x="244" y="126" width="196" height="44" rx="14"/><text x="342" y="154" fill="#e1d6ff" text-anchor="middle">Reading Books</text>
  <rect class="pill" x="455" y="126" width="160" height="44" rx="14"/><text x="535" y="154" class="cyan" text-anchor="middle">Gaming</text>
  <rect class="pill" x="630" y="126" width="236" height="44" rx="14"/><text x="748" y="154" fill="#e1d6ff" text-anchor="middle">Artificial Intelligence</text>
  <rect class="pill" x="881" y="126" width="155" height="44" rx="14"/><text x="958" y="154" class="cyan" text-anchor="middle">Creative Designing</text>
</g>
<path d="M42 203 C180 180 290 220 430 202 S700 182 1040 206" stroke="url(#edge)" stroke-width="2" fill="none" opacity=".7"><animate attributeName="stroke-dashoffset" from="0" to="-60" dur="5s" repeatCount="indefinite"/></path>
</svg>