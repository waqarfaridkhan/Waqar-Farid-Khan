<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="250" viewBox="0 0 1080 250" role="img" aria-labelledby="title desc">
<title id="title">EDUCATION</title><desc id="desc">Animated Midnight Glass education card for BSIT at Virtual University of Pakistan, currently studying in 7th semester.</desc>
<defs>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#191a30"/><stop offset="1" stop-color="#0d0e16"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .muted{fill:#aeb9d0}
    .white{fill:#f5f7ff}
    .cyan{fill:#38bdf8}
    .purple{fill:#dccfff}
    .card{fill:#171e30;stroke:#6277ac;stroke-opacity:.55}
    .pill{fill:#1b2236;stroke:#52628c;stroke-opacity:.65}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
</defs>
<rect width="1080" height="250" rx="26" fill="#0d0e16"/>
<circle cx="955" cy="76" r="96" fill="#a78bfa" opacity=".11" filter="url(#blur)"/>
<circle cx="118" cy="210" r="110" fill="#38bdf8" opacity=".10" filter="url(#blur)"/>
<rect x="3" y="3" width="1074" height="244" rx="24" fill="url(#surface)" stroke="#6477aa" stroke-opacity=".62" stroke-width="2"/>
<text x="42" y="45" class="white" font-size="23" font-weight="bold" letter-spacing="2">EDUCATION</text>
<text x="1038" y="45" text-anchor="end" fill="#a78bfa" font-size="13" letter-spacing="2">EDUCATION / 01</text>
<path d="M40 62 H1040" stroke="#40506f"/>
<path d="M40 62 H330" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="18 260;160 118;18 260" dur="7s" repeatCount="indefinite"/></path>
<circle cx="41" cy="40" r="4" fill="#38bdf8"><animate attributeName="opacity" values=".4;1;.4" dur="2.8s" repeatCount="indefinite"/></circle>

<text x="44" y="98" class="muted" font-size="16">Academic journey</text>
<rect class="card" x="44" y="118" width="992" height="92" rx="22"/>
<circle cx="104" cy="164" r="28" fill="#17253a" stroke="#38bdf8" stroke-opacity=".7"/><path d="M86 160l18-10 18 10-18 10-18-10zm6 12v8c10 7 20 7 24 0v-8" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
<text x="154" y="154" class="white" font-size="27" font-weight="bold">BS Information Technology (BSIT)</text>
<text x="154" y="181" class="cyan" font-size="18">Virtual University of Pakistan</text>
<rect x="792" y="136" width="222" height="56" rx="18" fill="#20263d" stroke="#a78bfa" stroke-opacity=".7"/><text x="903" y="157" text-anchor="middle" fill="#e1d6ff" font-size="14" font-weight="bold">Currently Studying</text><text x="903" y="178" text-anchor="middle" class="muted" font-size="14">7th Semester</text>
</svg>