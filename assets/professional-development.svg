<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="290" viewBox="0 0 1080 290" role="img" aria-labelledby="title desc">
<title id="title">PROFESSIONAL DEVELOPMENT</title><desc id="desc">Animated Midnight Glass professional development panel showing continuous learning areas without inventing certificate names.</desc>
<defs>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#191a30"/><stop offset="1" stop-color="#0d0e16"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .muted{fill:#aeb9d0}
    .white{fill:#f5f7ff}
    .cyan{fill:#38bdf8}
    .purple{fill:#dccfff}
    .card{fill:#171e30;stroke:#6277ac;stroke-opacity:.55}
    .pill{fill:#1b2236;stroke:#52628c;stroke-opacity:.65}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
</defs>
<rect width="1080" height="290" rx="26" fill="#0d0e16"/>
<circle cx="955" cy="76" r="96" fill="#a78bfa" opacity=".11" filter="url(#blur)"/>
<circle cx="118" cy="250" r="110" fill="#38bdf8" opacity=".10" filter="url(#blur)"/>
<rect x="3" y="3" width="1074" height="284" rx="24" fill="url(#surface)" stroke="#6477aa" stroke-opacity=".62" stroke-width="2"/>
<text x="42" y="45" class="white" font-size="23" font-weight="bold" letter-spacing="2">PROFESSIONAL DEVELOPMENT</text>
<text x="1038" y="45" text-anchor="end" fill="#a78bfa" font-size="13" letter-spacing="2">PROFESSIONAL DEVELOPMENT / 01</text>
<path d="M40 62 H1040" stroke="#40506f"/>
<path d="M40 62 H330" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="18 260;160 118;18 260" dur="7s" repeatCount="indefinite"/></path>
<circle cx="41" cy="40" r="4" fill="#38bdf8"><animate attributeName="opacity" values=".4;1;.4" dur="2.8s" repeatCount="indefinite"/></circle>

<text x="44" y="98" class="muted" font-size="16">Continuous learning focused on technology, growth, and practical improvement</text>
<text x="44" y="128" fill="#e7e4ff" font-size="17">Specific certification names are intentionally not listed because they were not provided.</text>
<g font-size="16" font-weight="bold">
  <rect class="pill" x="44" y="157" width="205" height="42" rx="13"/><text x="146" y="183" class="cyan" text-anchor="middle">Continuous Learning</text>
  <rect class="pill" x="264" y="157" width="160" height="42" rx="13"/><text x="344" y="183" fill="#e1d6ff" text-anchor="middle">AI Learning</text>
  <rect class="pill" x="439" y="157" width="192" height="42" rx="13"/><text x="535" y="183" class="cyan" text-anchor="middle">Skill Improvement</text>
  <rect class="pill" x="646" y="157" width="180" height="42" rx="13"/><text x="736" y="183" fill="#e1d6ff" text-anchor="middle">Tech Exploration</text>
  <rect class="pill" x="841" y="157" width="195" height="42" rx="13"/><text x="938" y="183" class="cyan" text-anchor="middle">Professional Growth</text>
</g>
<path d="M63 232 H1017" stroke="#354260" stroke-dasharray="8 10"><animate attributeName="stroke-dashoffset" from="0" to="-54" dur="4s" repeatCount="indefinite"/></path>
<text x="44" y="256" class="muted" font-size="15">Learning interests include AI, development, design, business, and practical technology applications.</text>
</svg>