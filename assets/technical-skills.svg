<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
<title id="title">TECHNICAL SKILLS</title><desc id="desc">Animated Midnight Glass technical skills overview for Waqar Farid showing programming, AI, design, tools and business skills.</desc>
<defs>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#191a30"/><stop offset="1" stop-color="#0d0e16"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .muted{fill:#aeb9d0}
    .white{fill:#f5f7ff}
    .cyan{fill:#38bdf8}
    .purple{fill:#dccfff}
    .card{fill:#171e30;stroke:#6277ac;stroke-opacity:.55}
    .pill{fill:#1b2236;stroke:#52628c;stroke-opacity:.65}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
</defs>
<rect width="1080" height="360" rx="26" fill="#0d0e16"/>
<circle cx="955" cy="76" r="96" fill="#a78bfa" opacity=".11" filter="url(#blur)"/>
<circle cx="118" cy="320" r="110" fill="#38bdf8" opacity=".10" filter="url(#blur)"/>
<rect x="3" y="3" width="1074" height="354" rx="24" fill="url(#surface)" stroke="#6477aa" stroke-opacity=".62" stroke-width="2"/>
<text x="42" y="45" class="white" font-size="23" font-weight="bold" letter-spacing="2">TECHNICAL SKILLS</text>
<text x="1038" y="45" text-anchor="end" fill="#a78bfa" font-size="13" letter-spacing="2">TECHNICAL SKILLS / 01</text>
<path d="M40 62 H1040" stroke="#40506f"/>
<path d="M40 62 H330" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="18 260;160 118;18 260" dur="7s" repeatCount="indefinite"/></path>
<circle cx="41" cy="40" r="4" fill="#38bdf8"><animate attributeName="opacity" values=".4;1;.4" dur="2.8s" repeatCount="indefinite"/></circle>

<text x="44" y="98" class="muted" font-size="16">Programming • Artificial Intelligence • Design • Tools • Business</text>
<g font-size="16" font-weight="bold">
  <rect class="card" x="42" y="118" width="480" height="82" rx="18"/><text x="68" y="150" class="cyan">01  Programming &amp; Web Development</text><text x="68" y="177" class="muted" font-size="14">HTML5 (Advanced) • CSS3 (Advanced) • JavaScript (Intermediate)</text><text x="68" y="196" class="muted" font-size="14">Python (Advanced) • PHP (Not Specified)</text>
  <rect class="card" x="558" y="118" width="480" height="82" rx="18"/><text x="584" y="150" fill="#e1d6ff">02  Artificial Intelligence</text><text x="584" y="177" class="muted" font-size="14">ChatGPT / AI Tools (Advanced) • Claude AI (Advanced)</text><text x="584" y="196" class="muted" font-size="14">Prompt Engineering (Advanced) • AI-Assisted Development (Intermediate)</text>
  <rect class="card" x="42" y="219" width="312" height="92" rx="18"/><text x="68" y="251" class="cyan">03  Design &amp; Creativity</text><text x="68" y="278" class="muted" font-size="14">Graphic Designing</text><text x="68" y="296" class="muted" font-size="14">UI/UX Design • Canva</text>
  <rect class="card" x="384" y="219" width="312" height="92" rx="18"/><text x="410" y="251" fill="#e1d6ff">04  Tools &amp; Technologies</text><text x="410" y="278" class="muted" font-size="14">Git • GitHub</text><text x="410" y="296" class="muted" font-size="14">VS Code</text>
  <rect class="card" x="726" y="219" width="312" height="92" rx="18"/><text x="752" y="251" class="cyan">05  Business Skills</text><text x="752" y="278" class="muted" font-size="14">Business Development</text><text x="752" y="296" class="muted" font-size="14">Sales &amp; Marketing • Communication</text>
</g>
<circle cx="1014" cy="93" r="7" fill="#38bdf8"><animate attributeName="r" values="5;8;5" dur="3.1s" repeatCount="indefinite"/></circle>
</svg>