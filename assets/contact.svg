<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300" role="img" aria-labelledby="title desc">
<title id="title">CONTACT ME</title><desc id="desc">Animated Midnight Glass contact card with GitHub, email, location, LinkedIn coming soon and portfolio under development.</desc>
<defs>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#191a30"/><stop offset="1" stop-color="#0d0e16"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .muted{fill:#aeb9d0}
    .white{fill:#f5f7ff}
    .cyan{fill:#38bdf8}
    .purple{fill:#dccfff}
    .card{fill:#171e30;stroke:#6277ac;stroke-opacity:.55}
    .pill{fill:#1b2236;stroke:#52628c;stroke-opacity:.65}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
</defs>
<rect width="1080" height="300" rx="26" fill="#0d0e16"/>
<circle cx="955" cy="76" r="96" fill="#a78bfa" opacity=".11" filter="url(#blur)"/>
<circle cx="118" cy="260" r="110" fill="#38bdf8" opacity=".10" filter="url(#blur)"/>
<rect x="3" y="3" width="1074" height="294" rx="24" fill="url(#surface)" stroke="#6477aa" stroke-opacity=".62" stroke-width="2"/>
<text x="42" y="45" class="white" font-size="23" font-weight="bold" letter-spacing="2">CONTACT ME</text>
<text x="1038" y="45" text-anchor="end" fill="#a78bfa" font-size="13" letter-spacing="2">CONTACT / 01</text>
<path d="M40 62 H1040" stroke="#40506f"/>
<path d="M40 62 H330" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="18 260;160 118;18 260" dur="7s" repeatCount="indefinite"/></path>
<circle cx="41" cy="40" r="4" fill="#38bdf8"><animate attributeName="opacity" values=".4;1;.4" dur="2.8s" repeatCount="indefinite"/></circle>

<text x="44" y="98" class="muted" font-size="16">Open to All Opportunities</text>
<rect class="card" x="44" y="118" width="992" height="138" rx="22"/>
<text x="72" y="156" class="white" font-size="26" font-weight="bold">Waqar Farid</text>
<text x="72" y="182" class="cyan" font-size="18">GitHub: github.com/Waqarfaridkhan</text>
<text x="72" y="208" fill="#e1d6ff" font-size="18">Email: waqarfaridkhan01@gmail.com</text>
<text x="72" y="234" class="muted" font-size="17">Location: Sahiwal, Pakistan</text>
<rect x="722" y="139" width="286" height="42" rx="14" fill="#20263d" stroke="#38bdf8" stroke-opacity=".65"/><text x="865" y="166" text-anchor="middle" class="cyan" font-size="16" font-weight="bold">LinkedIn: Coming Soon</text>
<rect x="722" y="194" width="286" height="42" rx="14" fill="#20263d" stroke="#a78bfa" stroke-opacity=".65"/><text x="865" y="221" text-anchor="middle" fill="#e1d6ff" font-size="16" font-weight="bold">Portfolio: Under Development</text>
<path d="M950 93 q16 13 0 26 q-16 13 0 26" stroke="#38bdf8" fill="none" stroke-width="3"><animate attributeName="opacity" values=".5;1;.5" dur="2.2s" repeatCount="indefinite"/></path>
</svg>