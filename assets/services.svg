<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330" role="img" aria-labelledby="title desc">
<title id="title">SERVICES</title><desc id="desc">Animated Midnight Glass services cards showing web development, AI-powered solutions, graphic designing, business development, UI UX design and prompt engineering.</desc>
<defs>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#191a30"/><stop offset="1" stop-color="#0d0e16"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .muted{fill:#aeb9d0}
    .white{fill:#f5f7ff}
    .cyan{fill:#38bdf8}
    .purple{fill:#dccfff}
    .card{fill:#171e30;stroke:#6277ac;stroke-opacity:.55}
    .pill{fill:#1b2236;stroke:#52628c;stroke-opacity:.65}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
</defs>
<rect width="1080" height="330" rx="26" fill="#0d0e16"/>
<circle cx="955" cy="76" r="96" fill="#a78bfa" opacity=".11" filter="url(#blur)"/>
<circle cx="118" cy="290" r="110" fill="#38bdf8" opacity=".10" filter="url(#blur)"/>
<rect x="3" y="3" width="1074" height="324" rx="24" fill="url(#surface)" stroke="#6477aa" stroke-opacity=".62" stroke-width="2"/>
<text x="42" y="45" class="white" font-size="23" font-weight="bold" letter-spacing="2">SERVICES</text>
<text x="1038" y="45" text-anchor="end" fill="#a78bfa" font-size="13" letter-spacing="2">SERVICES / 01</text>
<path d="M40 62 H1040" stroke="#40506f"/>
<path d="M40 62 H330" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="18 260;160 118;18 260" dur="7s" repeatCount="indefinite"/></path>
<circle cx="41" cy="40" r="4" fill="#38bdf8"><animate attributeName="opacity" values=".4;1;.4" dur="2.8s" repeatCount="indefinite"/></circle>

<text x="44" y="98" class="muted" font-size="16">What Waqar Farid offers</text>
<g font-size="20" font-weight="bold">
  <rect class="card" x="44" y="121" width="300" height="72" rx="18"/><text x="194" y="164" class="cyan" text-anchor="middle">Web Development</text>
  <rect class="card" x="390" y="121" width="300" height="72" rx="18"/><text x="540" y="164" fill="#e1d6ff" text-anchor="middle">AI-Powered Solutions</text>
  <rect class="card" x="736" y="121" width="300" height="72" rx="18"/><text x="886" y="164" class="cyan" text-anchor="middle">Graphic Designing</text>
  <rect class="card" x="44" y="216" width="300" height="72" rx="18"/><text x="194" y="259" fill="#e1d6ff" text-anchor="middle">Business Development</text>
  <rect class="card" x="390" y="216" width="300" height="72" rx="18"/><text x="540" y="259" class="cyan" text-anchor="middle">UI/UX Design</text>
  <rect class="card" x="736" y="216" width="300" height="72" rx="18"/><text x="886" y="259" fill="#e1d6ff" text-anchor="middle">Prompt Engineering</text>
</g>
</svg>